[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cbbe3bbb"
version = "0.6.0"
description = "Fallout 4 Body & Physics Converter: converts BodySlide outfit projects between bodies (production route: CBBE → CBBE 3BBB physics)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cbbe3bbb = "cbbe3bbb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 140
src = ["src", "tests"]
